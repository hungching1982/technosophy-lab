features_lede: 這本書的語言淺白，例子來自日常，承載的卻是一條結構嚴密的論證。它最終提出的，是一套重新思考技術、行為與政治的新框架，以及由此出發的實作進路。
features:
- title: 從應用的問題，走到理論的前提
  text: 起點很具體：人們明明知道該怎麼做，行為卻沒有改變；那麼，能不能、又該不該用技術來引導行為？為了回答「該不該」，論證不得不往下挖，觸及我們如何理解自由、如何設想「人」，以及民主政治以什麼為基礎。走到最後，連起點本身也被重新檢視：當初想要捍衛的「永續」，它的價值地位同樣被放回政治場域之中。這段從起點到終點的距離，就是這本書的理論幅度。
- title: 原創的框架，與其中的新概念
  text: 書中提出了幾個新的概念：「行的人類中心主義」「漸進行為工程」「政治化技術」，乃至把永續理解為一種「擺盪」。但它們並不是各自獨立的發明，而是同一個體系在不同位置長出來的部分；一旦單獨抽離出來，它們的意思就會變小。構成這套體系的資源，則來自不同、甚至彼此緊張的思想傳統，依照每個階段遺留的難題被挑選、重新詮釋，再一環一環接合起來。也因此，把章節拆開、逐一對照前人說過什麼，很容易錯失它的新意。減速丘是個好例子：它在書中反覆出現，但每次所處的位置與所代表的意義，都隨著論證推進而改變。
- title: 換的是框架，不只是答案
  text: 它給的不是同一套前提下的另一個答案，而是整個看問題的方式都換了；什麼算干預、什麼樣的干預才正當、民主該長什麼樣子，都會跟著改變。所以閱讀時常有兩種時刻：一種是覺得哪裡不對，卻指不出論證錯在哪一步；另一種是覺得好像沒什麼新意。前者往往是因為，我們拿來判斷對錯的標準，恰好就是書中正在重新檢視的對象；後者則是因為書裡的概念，被我們不自覺地譯回了原有信念中的意思。在這裡被重新理解的，不只是技術，也包括「人」，以及我們一向理所當然地留給「人」的那個位置。
- title: 不只診斷，還有建構
  text: 揭露技術的權力、指出它的風險，是技術哲學與 STS 長期的重要工作。這本書在診斷之後，嘗試向前多走一步——不只問「哪裡有問題」，也認真回答「那該怎麼做」。它把答案落實到可以設計、可以實施的層次，而這些做法本身就預留了檢驗與修正的空間：可以實驗，也可以重來。
- title: 重置人文與理工的分工
  text: 技術在這裡不只是被評價的對象，更是哲學提問的起點，也就是書中所說的「始於技術的哲學」（<span lang="en">philosophy FROM technology</span>）。於是，做工程設計，可以是在研究行為與價值如何形成；反過來，思考自由與民主，也需要理解物質如何運作。淺白的寫法正是為此而來：設計者與工程師不該只是理論的接收者，而是這場討論的參與者。
features_close: 環境倡議說了幾十年，為什麼難以化為行動？以共識為目標的民主，為什麼化解不了衝突？我們對技術的依賴與恐懼，為什麼總是同時存在？這本書不急著回答，而是邀請你換一個視角，重新提出這些問題，並構想新穎且另類的回答。
