back_cover:
- 我們花了這麼多力氣在知識轉譯和教育推廣，為何人們的行為還是沒改變？
- 若知識、勸說與善意並不足以讓人友善環境，能不能換個方向，從改變身邊的技術開始？
- 《設計永續》就從這個轉向開始。如果技術不只是供人使用的工具，也會反過來塑造人的行動，問題很快就不再只是「如何讓人更環保？」作者洪靖以「行為嚮導技術」作為思索技術干預的起點，展開一連串直指根本的追問：技術介入是否侵犯自由？我們所說的自由預設了什麼樣的人？技術會不會本來就是政治的一部分？循著這些追問，本書從環境危機與行為改變出發，一路走向設計方案、人類圖像、民主政治，甚至重新檢視原本用來判斷「技術介入是否正當」的標準。
- 本書藉由穿越技術哲學與 STS、行為心理學、環境教育與設計，乃至政治理論的領域界線，將各自的觀點與方法融進一條由問題驅動的論證鏈中，並重新組構彼此的位置和功能。它並非以西方理論解釋東方經驗，也不是讓本土案例回過頭來補充既有理論，更非從東方的位置反省西方。反之，它直接進入西方思想內部，透過內在批判與理論重構，追問現代社會與思想中那些被視為理所當然的基本前提，逐步發展出一套新的思考框架與實作路徑，為重新安排人類與技術如何共同生活打開更多可能。
