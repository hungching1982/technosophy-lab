# chapters：九章濃縮，取材自 Argument Overview 第二版（assets/files/Design_for_Green_Argument_Overview_v2.pdf）。
verbeek_quote: 'I hope that his readers will take up the challenge he sets us: to design—and to demand—technologies that help us live well on a finite planet.'
fu_quote: 'A novel and original theoretical bricolage for behavior-steering technology, and a reflective perspective that answers to the crisis of our time.'
fu_title: 'A Novel and Original Bricolage from East Asia'
fu_excerpt:
- 'Rather than adopting the latest fashionable Western theory and applying it to Taiwanese cases, Ching Hung addresses one of the great problems of our time and, with a discerning eye, seeks out the relevant Western wisdom, including theories that have largely gone out of fashion, such as Skinner’s behavioral psychology and Popper’s political philosophy. He reinterprets them, adds Mouffe’s more recent post-Marxist theory of agonistic democracy, and integrates them into his own field of philosophy of technology and STS, arriving, through “independent bricolage,” at a perspective of design for green with its own distinctive character.'
- It is a novel and original theoretical bricolage for behavior-steering technology, and a reflective perspective that answers to the crisis of our time.
about:
- 'Although the book begins with the environmental crisis, it is not a book about environmental protection. The crisis serves as its entry point and its stress test: a field in which behavior-steering technology is most needed and hardest to justify. The book asks whether technology can, whether it should, and how it may intervene in human behavior, and what this means for our understanding of freedom, human imagery, and democracy.'
- 'Published in Traditional Chinese in October 2026, the book is a substantially revised and extended version of the author’s English doctoral dissertation (University of Twente, 2019). Its argument unfolds across nine chapters, each building on the last.'
chapters:
- title: From Nature-Friendly Technology to Nature-Friendly Users
  text: 'Technology has contributed to the environmental crisis, but abandoning it is neither realistic nor desirable. Nor are nature-friendly technologies enough: because of the rebound effect, they do not necessarily produce nature-friendly behavior. The focus therefore shifts from technologies to their users, and to behavior-steering technology, designed to shape human behavior in a desired direction. Its very possibility raises the questions the book pursues. Is it an exercise of power over users? Does it threaten freedom? Can it cultivate sustainable persons, or only sustainable behavior?'
- title: Why Behavior-Steering Technology Is Needed
  text: 'Environmental education assumes that knowing initiates doing, yet it keeps running into the knowing-doing gap. Environmental ethics has worked hard to overcome knowing-anthropocentrism, but has paid far less attention to doing-anthropocentrism. In the Anthropocene, non-intervention is no longer an option: if the technological treatment of damaged nature is acceptable, we must ask when a comparable treatment of environmentally harmful human behavior is. Behavior-steering technology complements environmental education. For those who accept environmental values, it can bridge the knowing-doing gap; for those who do not, it can bypass it.'
- title: Two Types of Behavior-Steering Technology
  text: 'Behavior-steering technologies work through two routes. Informational ones, such as persuasive technology and nudges, operate intrasomatically, through signs and cues that users must notice and interpret. Material ones operate extrasomatically, arranging the material conditions that facilitate, hinder, or constrain particular actions: speed bumps, heavy hotel key fobs, architectural layouts. Material behavior-steering technology is usually more effective and more durable. Yet the very material force that makes it effective also makes it ethically controversial.'
- title: The Problem Concerning Human Freedom
  text: 'The most fundamental concern is freedom. Existing defenses limit intervention to the means users employ, not the ends they pursue. Sustainability, however, requires collective change from people who do not share environmental goals, so green behavior-steering technology cannot avoid intervening in ends. Appeals to the harm principle, the distinction between negative and positive liberty, and the ubiquity of technological mediation each offer partial answers, but none resolves the dilemma. Perhaps the conventional understanding of freedom is itself part of the problem.'
- title: Rethinking Behavior and Freedom
  text: 'B. F. Skinner shifts attention from an “inner man” to the relation between behavior and environment. Because the consequences of anti-environmental behavior are deferred and dispersed, material technologies that introduce primary consequences become crucial. Revising Skinner, the chapter argues that only long-term positive reinforcement is genuine positive reinforcement; under it, the gap between feeling free and being free largely disappears. Freedom is not the absence of control, but being embedded in a genuinely positively reinforcing environment. Two problems remain: how to reduce existing anti-environmental behavior, and how to design for green without first proving that green is good.'
- title: Piecemeal-Behavioral Engineering
  text: 'A comparison of two Skinnerian communities, Twin Oaks and Los Horcones, shows that social reform depends on behavioral change, and that behavioral engineering is experimental by nature and must stay at a manageable, community scale. Here Skinner meets Karl Popper’s piecemeal engineering. Since no ultimate good can be known, we design not for the good but against identifiable evils, reducing anti-environmental behavior while making other options positively reinforcing. Small scale, observability, adjustability, and reversibility are not external ethical restrictions; they follow from the internal logic of the approach.'
- title: Design Recommendations and Village Homes
  text: 'The argument is translated into seven design recommendations, condensed in one sentence: design and experiment with material behavior-steering technology at the level of community to reduce anti-environmental behavior. Village Homes in California shows that this is feasible. Its narrow, curving cul-de-sacs make driving less attractive, while paths, green commons, and landscapes make other options more satisfying, and they enable the community’s other green designs to work. Piecemeal-behavioral engineering is thus also an analytical perspective. Within liberal democracy, the approach is already workable, but it remains provisional.'
- title: Agonistic Democracy as a Political Framework
  text: 'At the core of the crisis lies the tension between the individual and the collective. Liberal and communitarian democracy both resolve it through rational consent, resting on a Kantian human imagery that research increasingly calls into question. What is needed is a democracy with downward compatibility, one that still works when rational consensus cannot be reached. Chantal Mouffe’s agonistic democracy offers such a framework. Within it, green behavior-steering technology is a counter-hegemonic practice: its legitimacy comes not from first proving that being green is good, but from helping to make it valued. Sustainability becomes an ongoing oscillation, and the piecemeal approach still applies, for epistemological reasons.'
- title: 'Conclusion: Activating Technologies'
  text: 'Three implications follow. Educational environments complement environmental education by letting people practice the right behavior repeatedly. Design should include design to discourage, paired with reinforcing alternatives, and proceed as experimentation. Politicalizing technology asks not only how to democratize technology, but how to use technological power within democratic struggle. The environmental crisis is the entry point; the larger concern is how humans, technologies, and nonhuman nature can be reconfigured together. To activate technology is to practice philosophy from technology.'
