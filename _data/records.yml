# 學生表現與榮譽（沒有發過最新消息的紀錄放這裡）。
# 發過最新消息的學生紀錄不必重寫：成員頁會自動從 _data/news.yml 讀取。
# 兩邊合併後依日期排列，新的在上；畫面只顯示西元年份，最近 8 則直接顯示，其餘折疊。
#
# 欄位：
#   date     日期。只知道年份寫 '2025'；知道月份寫 '2025-10'；知道日期寫 '2025-10-31'（請加引號）
#   type     類別：獲獎、發表等（兩個字）
#   who      學生姓名；成員寫成「盧怡薰（成員）」；團隊沒有完整名單時寫隊名（如 CCU-Taiwan 7th）或「修課學生」
#   title    獎項或發表名稱
#   summary  第二行補充（可省略）
#   （同一天的多筆紀錄，寫在下面的會排在上面）
#   links    連結（可省略），接在第二行最後；每個連結寫 url 與 text，例如 text: 全文
#   advisor  指導老師：寫 true 代表「洪靖」；有多位時直接寫名字（依此順序顯示）

